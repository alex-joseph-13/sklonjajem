<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склоняем</title></title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.orange.min.css">
    <link rel="stylesheet" href="./style.css">
    <!link rel="icon" href="./favicon.ico" type="image/x-icon">
	
	<script src="noun.js"></script>
	<script src="verb.js"></script>
	<script src="adjective.js"></script>
	<script src="lexicon.js"></script>
	<script src="exercises.js"></script>
	<script src="script.js" defer></script>
  </head>
  <body>
  
	<header>
		<nav>
			<ul>
				<li><h1>Склоняем</h1></li>
			</ul>
			<ul>
				<li id=pos_buttons>
					<button id=pos_noun onclick="switch_pos('noun')">nouns</button>
					<button id=pos_verb onclick="switch_pos('verb')" class="secondary">verbs</button>
					<button id=pos_adj onclick="switch_pos('adjective')" class="secondary">adjectives</button>
				</li>
			</ul>
		</nav>
	</header>
	
    <main>
		
		
		<div id="quiz_tab" class = "container">
		
			<button id="settings_button" onclick="click_settings_button()">Start Practicing</button>
			
			<article hidden id="quiz">
				<p id=english_sentence></p>
				<p id=russian_lemma></p>
				<p id=help></p>
				<p id=russian_sentence></p>
				
				<p id="correct" hidden>Correct!</p>
				<p id="incorrect" hidden>Incorrect!</p>
			</article>
			
			<div id="settings"></div>
			
		</div>
		
		
		<div id="debug_tab" hidden>
			<table>
			  <tbody id="tbody">
				<tr>
					<th></th>
					<th>singular</th>
					<th>plural</th>
				</tr>
				<tr>
					<th>nominative</th>
					<th></th>
					<th></th>
				</tr>
				<tr>
					<th>genitive</th>
					<th></th>
					<th></th>
				</tr>
				<tr>
					<th>dative</th>
					<th></th>
					<th></th>
				</tr>
				<tr>
					<th>accusative</th>
					<th></th>
					<th></th>
				</tr>
				<tr>
					<th>instrumental</th>
					<th></th>
					<th></th>
				</tr>
				<tr>
					<th>prepositional</th>
					<th></th>
					<th></th>
				</tr>
				<tr>
					<th>English:</th>
					<th></th>
					<th></th>
				</tr>
			  </tbody>
			</table>
			
			<button onclick="nextWord()">next word</button>
		
		</div>
		
		
		
		
		
    </main>
	
	
	<footer>
		<button id="dev_mode_button" class="contrast" onclick="quiz_tab.hidden = !quiz_tab.hidden; debug_tab.hidden = !debug_tab.hidden">dev mode</button>
	</footer>
    
  </body>
  
</html>
